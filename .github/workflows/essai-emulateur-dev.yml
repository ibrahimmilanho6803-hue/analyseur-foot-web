# Mise au point de l'essai de l'APK dans un téléphone virtuel (fichier temporaire : il sera intégré à « APK Android » puis supprimé).
# Reprend l'APK d'une construction déjà réussie au lieu d'en refaire une (gain de 9 minutes par essai). Lancement à la main.
name: Essai émulateur (mise au point)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Numéro de l'exécution « APK Android » dont on reprend l'APK (vide : la dernière réussie de la branche)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  essai:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Choisir l'exécution dont on reprend l'APK
        id: choix
        env:
          GH_TOKEN: ${{ github.token }}
          DEMANDE: ${{ inputs.run_id }}
        run: |
          ID="$DEMANDE"
          if [ -z "$ID" ]; then
            ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow apk-android.yml --branch "$GITHUB_REF_NAME" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "::notice title=APK repris de l'exécution::$ID"

      - name: Récupérer l'APK
        uses: actions/download-artifact@v8
        with:
          name: analyseur-foot-pro-apk
          path: apk
          run-id: ${{ steps.choix.outputs.id }}
          github-token: ${{ github.token }}

      - name: Activer KVM (accélération matérielle de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Réveiller le serveur (il s'endort quand personne ne l'utilise)
        run: |
          R="$(curl -sS -m 150 -o /dev/null -w 'HTTP %{http_code} en %{time_total} s' https://analyseur-foot-api.onrender.com/api/teams 2>&1 || true)"
          echo "::notice title=Serveur::$R"

      - name: Essai dans un téléphone virtuel Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          script: python3 .github/scripts/essai_emulateur.py apk/analyseur-foot-pro.apk captures

      - name: Publier les captures (mise au point)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          [ -d captures ] || { echo "pas de captures"; exit 0; }
          pip install --quiet pillow
          python3 .github/scripts/publier_captures_dev.py captures

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: essai-emulateur
          path: captures
          retention-days: 14
